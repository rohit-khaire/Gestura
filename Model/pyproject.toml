[project]
name = "sign-detection-model"
version = "0.2.0"
description = "DETR-based sign / gesture detection model and its FastAPI service."
requires-python = ">=3.12,<3.13"

# Everything the API needs at runtime (keep in sync with requirements.txt, which the Dockerfile uses).
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.1",
    "python-multipart>=0.0.20",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.4",
    "requests>=2.31.0",
]

[project.optional-dependencies]
# Only needed to train / evaluate / look at augmented samples.
train = [
    "albumentations>=2.0.8",
    "scipy>=1.11.0",
    "matplotlib>=3.10.5",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
